<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal de Notas · OFIAI</title>
<meta name="description" content="Consulta tus notas desde cualquier lugar." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-card">
    <div class="brand">
      <span class="mark">OF<span class="accent">IA</span>I</span>
    </div>
    <p class="lede">Portal de Notas — ingresa con tu correo y tu DNI</p>

    <div id="login-error" class="form-error" role="alert"></div>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" autocomplete="username" required placeholder="tucorreo@ejemplo.com" />
      </div>
      <div class="field">
        <label for="dni">DNI</label>
        <input type="password" id="dni" name="dni" autocomplete="current-password" inputmode="numeric" required placeholder="Tu número de DNI" />
        <p class="hint">Es tu contraseña: el número de tu DNI, tal como está registrado.</p>
      </div>
      <button type="submit" id="login-btn" class="btn-primary">Ingresar</button>
    </form>

    <p class="login-foot">
      ¿Problemas para ingresar? Comunícate con tu profesor(a) para verificar el correo con el que fuiste registrado(a).
    </p>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
